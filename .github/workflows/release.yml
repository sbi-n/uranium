name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            cmake_args: ''
          - runner: macos-15
            platform: macos-aarch64
            cmake_args: ''
          - runner: windows-2022
            platform: windows-x86_64
            cmake_args: '-A x64'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install CMake
        run: python -m pip install "cmake>=4.1,<5"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --target uranium ir_tests decompiler_tests --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist package
          cp build/uranium README.md package/
          cp extern/luau/LICENSE.txt package/LUAU-LICENSE.txt
          COPYFILE_DISABLE=1 tar -czf "dist/uranium-${{ matrix.platform }}.tar.gz" -C package .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, package
          Copy-Item build/Release/uranium.exe, README.md package/
          Copy-Item extern/luau/LICENSE.txt package/LUAU-LICENSE.txt
          Compress-Archive -Path package/* -DestinationPath "dist/uranium-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: uranium-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: uranium-*
          path: dist
          merge-multiple: true

      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" * --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" * --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
